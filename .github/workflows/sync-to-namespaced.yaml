name: Copy NPC-V2 Files to Namespaced Branch

on:
  workflow_dispatch:  # Manual trigger
  push:
    branches:
      - main

jobs:
  copy-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy files with history
        run: |
          # Create namespaced branch from main
          git checkout -b namespaced main
          
          # Use filter-repo to move files and preserve history
          git filter-repo --path data/npc-v2/ --to-subdirectory-filter . --force
          
          # Push the branch
          git push origin namespaced --force