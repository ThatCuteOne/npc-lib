name: Copy NPC-V2 Files to Namespaced Branch

on:
  workflow_dispatch:  # Manual trigger
  push:
    branches:
      - main

jobs:
  copy-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-filter-repo
        run: |
          pip install git-filter-repo
      - name: Copy files with history
        run: |
          # Create namespaced branch from main
          git checkout -b temp-namespaced main
          
          # Use filter-repo to move files and preserve history
          git filter-repo --subdirectory-filter data/npc-v2 --force

          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          # Push the branch
          git push origin HEAD:namespaced --force